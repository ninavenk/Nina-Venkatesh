<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Media — NV</title>


    <!-- FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Syne:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="assets/css/media.css"
    >

</head>


<body class="media-page">

    <div class="page-bg"></div>


    <!-- NAVIGATION -->

    <header class="navbar">

        <a href="index.html" class="logo">
            NV
        </a>

        <nav class="nav-links">

            <a href="about.html">ABOUT</a>

            <a href="career.html">CAREER</a>

            <a href="gallery.html">GALLERY</a>

            <a href="media.html">MEDIA</a>

            <a href="contact.html" class="contact-link">
                CONTACT
            </a>

        </nav>

    </header>



    <!-- MAIN -->

    <main class="media-main">


        <!-- INTRO -->

        <section class="media-intro">

            <p class="media-eyebrow">
                MEDIA / <span id="story-count">05</span> STORIES
            </p>

            <h1>
                Stories,
                <br>
                <span>results & moments.</span>
            </h1>

        </section>



        <!-- FEATURED / ACTIVE STORY -->

        <section class="featured" id="featured">

            <div class="section-label">
                FEATURED
            </div>


            <a
                href="#"
                class="featured-article"
                id="featured-link"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="featured-image">

                    <img
                        id="featured-image"
                        src=""
                        alt=""
                    >

                </div>


                <div class="featured-info">

                    <p
                        class="article-publication"
                        id="featured-publication"
                    ></p>


                    <h2
                        id="featured-title"
                    ></h2>


                    <div class="article-meta">

                        <span
                            id="featured-date"
                        ></span>

                        <span class="article-arrow">
                            ↗
                        </span>

                    </div>

                </div>

            </a>

        </section>



        <!-- ARTICLE LIST -->

        <section
            class="media-archive"
            id="media-archive"
        >
        </section>



        <!-- FOOTER -->

        <footer class="media-footer">

            <span>
                NV — INTERNATIONAL SWIMMER
            </span>

            <span>
                © 2026
            </span>

        </footer>


    </main>


    <!-- JAVASCRIPT -->

    <script src="assets/js/media.js"></script>

</body>

</html>
